# Bridge Gazebo world pose info to a TFMessage stream the controller can read.
# On Humble/Fortress use ignition.msgs.* type names.
- ros_topic_name: "/world/default/pose/info"
  gz_topic_name:  "/world/default/pose/info"
  ros_type_name:  "tf2_msgs/msg/TFMessage"
  gz_type_name:   "ignition.msgs.Pose_V"
  direction:      GZ_TO_ROS
